# Docker's embedded DNS, so upstream names re-resolve if a node restarts.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream centrifugo {
    server centrifugo-1:8000;
    server centrifugo-2:8000;
    # Default round-robin. NO sticky sessions - the /emulation POST may land on a
    # different node than the stream; Centrifugo routes it internally.
}

# Standard WebSocket upgrade mapping.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    listen 8443 ssl;

    ssl_certificate     /certs/server.crt;
    ssl_certificate_key /certs/server.key;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Real-time connection endpoints: WebSocket, SSE and HTTP-streaming.
    location /connection/ {
        proxy_pass http://centrifugo;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # CRITICAL for SSE / HTTP-streaming: never buffer the server->client
        # stream, or pushes would only reach the client when the response ends.
        proxy_buffering off;
        proxy_cache off;

        # Must stay ABOVE Centrifugo's ping_interval or idle connections get cut.
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Bidirectional emulation: client->server commands for SSE / HTTP-streaming.
    # A normal short POST; just needs to reach any node (no stickiness).
    location = /emulation {
        proxy_pass http://centrifugo;
        proxy_http_version 1.1;
        proxy_buffering off;
    }

    # Everything else (health, API is not exposed here in this demo).
    location / {
        proxy_pass http://centrifugo;
    }
}
