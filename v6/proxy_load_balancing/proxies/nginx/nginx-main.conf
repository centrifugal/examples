# Main nginx config tuned to hold many thousands of connections.
# The connection-scaling knobs (worker_rlimit_nofile, worker_connections) live
# here in the top-level/events context, NOT in the server block (default.conf).

worker_processes auto;

# Raise the per-worker open-file ceiling. Must be <= the container's nofile
# ulimit (set in docker-compose.yml). Each proxied client uses 2 fds
# (downstream client + upstream connection).
worker_rlimit_nofile 1048576;

events {
    # Max simultaneous connections per worker. For N proxied clients you need
    # roughly 2*N here (client + upstream). 65535 comfortably covers 10k+.
    worker_connections 65535;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;
    error_log  /dev/stderr;

    sendfile on;

    # Load the server block (upstream + locations) from conf.d.
    include /etc/nginx/conf.d/*.conf;
}
