global
    log stdout format raw local0
    # Max concurrent connections HAProxy will accept. HAProxy sizes its own fd
    # limit from this, so it must be backed by a high container nofile ulimit
    # (set in docker-compose.yml). Comfortably covers 10k+ clients.
    maxconn 200000

defaults
    mode http
    log global
    option httplog
    maxconn 200000
    # http-no-delay forwards data immediately instead of batching - important for
    # low-latency streaming (SSE / HTTP-streaming) and WebSocket frames.
    option http-no-delay
    timeout connect 5s
    timeout client  1h
    timeout server  1h
    # timeout tunnel governs an established WebSocket (post-Upgrade) connection.
    # Keep it well above Centrifugo's ping_interval.
    timeout tunnel  1h
    timeout http-keep-alive 10s

frontend fe
    bind :8080
    bind :8443 ssl crt /certs/server.pem
    default_backend be_centrifugo

backend be_centrifugo
    balance roundrobin
    # No cookie/stick-table: emulation POSTs may hit either node by design.
    server c1 centrifugo-1:8000
    server c2 centrifugo-2:8000
