# Envoy L7 config: HTTP on 8080, HTTPS on 8443, round-robin over the two
# Centrifugo nodes. WebSocket upgrades enabled; per-route timeout disabled so
# long-lived streams (SSE / HTTP-streaming / WebSocket) are never cut.
#
# Scaling to 10k+ connections needs TWO things here: (1) the high nofile ulimit
# in docker-compose.yml, and (2) raised cluster circuit_breakers (see the
# `centrifugo` cluster below) - Envoy's defaults otherwise cap it at ~1024.
#
# Optional safety cap on total downstream connections (good production hygiene;
# also silences Envoy's "no configured limit" startup warning). NOTE: this is NOT
# what lifts the ~1024 connection cap - that's the cluster circuit_breakers below.
overload_manager:
  resource_monitors:
    - name: "envoy.resource_monitors.global_downstream_max_connections"
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.resource_monitors.downstream_connections.v3.DownstreamConnectionsConfig
        max_active_downstream_connections: 200000

static_resources:
  listeners:
    - name: listener_http
      address: { socket_address: { address: 0.0.0.0, port_value: 8080 } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                stream_idle_timeout: 0s
                upgrade_configs:
                  - upgrade_type: websocket
                route_config: &routes
                  name: local_route
                  virtual_hosts:
                    - name: centrifugo
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route:
                            cluster: centrifugo
                            # Disable the default 15s route timeout for streaming.
                            timeout: 0s
                http_filters: &filters
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    - name: listener_https
      address: { socket_address: { address: 0.0.0.0, port_value: 8443 } }
      filter_chains:
        - transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              common_tls_context:
                tls_certificates:
                  - certificate_chain: { filename: /certs/server.crt }
                    private_key: { filename: /certs/server.key }
          filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_https
                stream_idle_timeout: 0s
                upgrade_configs:
                  - upgrade_type: websocket
                route_config: *routes
                http_filters: *filters

  clusters:
    - name: centrifugo
      connect_timeout: 5s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      # CRITICAL for many connections: Envoy's per-cluster circuit breakers
      # default to 1024 (max_connections, max_pending_requests, max_requests;
      # max_retries defaults to 3). Each WebSocket upgrade / streaming request is
      # one active upstream request, so without raising these Envoy caps at ~1024
      # connections and drops the rest. Raise well above the target count.
      circuit_breakers:
        thresholds:
          - priority: DEFAULT
            max_connections: 1000000
            max_pending_requests: 1000000
            max_requests: 1000000
            max_retries: 1000000
      load_assignment:
        cluster_name: centrifugo
        endpoints:
          - lb_endpoints:
              - endpoint: { address: { socket_address: { address: centrifugo-1, port_value: 8000 } } }
              - endpoint: { address: { socket_address: { address: centrifugo-2, port_value: 8000 } } }
