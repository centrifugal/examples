# Traefik static config.
# Scaling: Traefik (Go) does not cap connections by default - it is bounded by
# open file descriptors, so the high nofile ulimit in docker-compose.yml is what
# lets it hold 10k+ connections.
entryPoints:
  web:
    address: ":8080"
  websecure:
    address: ":8443"

providers:
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

log:
  level: INFO

# Disable the dashboard/api and telemetry for a clean demo.
api:
  dashboard: false
