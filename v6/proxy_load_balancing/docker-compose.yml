# Proxy / load-balancer conformance harness for Centrifugo.
#
# Topology: Redis + two Centrifugo nodes behind ONE L7 proxy (swappable via
# compose profiles). A Node test runner (centrifuge-js) connects THROUGH the
# proxy over WebSocket, HTTP-streaming and SSE (both plaintext and TLS) and
# asserts real end-to-end delivery. Two nodes with no sticky sessions is what
# actually exercises the SSE/HTTP-stream `/emulation` cross-node routing.
#
# Everything runs in docker compose. See run.sh for the orchestrated matrix.

# High open-file limit so every container can hold many thousands of connections
# (each proxied connection costs 2 fds at the proxy: client + upstream). Applied
# to Centrifugo, the proxies and the load generator. See the "Scaling" note in
# the README and docs/server/load_balancing.md.
x-ulimits: &big-ulimits
  nofile:
    soft: 1048576
    hard: 1048576

services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  # One-shot: generates a CA + server cert (SAN: proxy, localhost) into ./certs.
  # Proxies present the server cert; the tester trusts the CA. Idempotent.
  certgen:
    image: alpine:3.20
    volumes:
      - ./certs:/certs
      - ./certs/gen-certs.sh:/gen-certs.sh:ro
    command: ["sh", "/gen-certs.sh"]

  centrifugo-1: &centrifugo
    image: centrifugo/centrifugo:v6.8.1
    command: centrifugo -c /centrifugo/centrifugo.json
    ulimits: *big-ulimits
    volumes:
      - ./centrifugo.json:/centrifugo/centrifugo.json:ro
    environment:
      CENTRIFUGO_NODE_NAME: node-1
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy

  centrifugo-2:
    <<: *centrifugo
    environment:
      CENTRIFUGO_NODE_NAME: node-2
    ports:
      - "8001:8000"

  # ---- Swappable L7 proxies (one at a time via profiles). Each is reachable
  # ---- on the internal network as `proxy` and listens on 8080 (http/ws) and
  # ---- 8443 (https/wss), load-balancing across the two Centrifugo nodes.
  nginx:
    image: nginx:1.27-alpine
    profiles: ["nginx"]
    ulimits: *big-ulimits
    networks:
      default:
        aliases: ["proxy"]
    volumes:
      - ./proxies/nginx/nginx-main.conf:/etc/nginx/nginx.conf:ro
      - ./proxies/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/certs:ro
    ports:
      - "8080:8080"
      - "8443:8443"
    depends_on:
      certgen:
        condition: service_completed_successfully
      centrifugo-1:
        condition: service_started
      centrifugo-2:
        condition: service_started

  haproxy:
    image: haproxy:2.9-alpine
    profiles: ["haproxy"]
    ulimits: *big-ulimits
    networks:
      default:
        aliases: ["proxy"]
    volumes:
      - ./proxies/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./certs:/certs:ro
    ports:
      - "8080:8080"
      - "8443:8443"
    depends_on:
      certgen:
        condition: service_completed_successfully
      centrifugo-1:
        condition: service_started
      centrifugo-2:
        condition: service_started

  envoy:
    image: envoyproxy/envoy:v1.31-latest
    profiles: ["envoy"]
    ulimits: *big-ulimits
    networks:
      default:
        aliases: ["proxy"]
    volumes:
      - ./proxies/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ./certs:/certs:ro
    ports:
      - "8080:8080"
      - "8443:8443"
    depends_on:
      certgen:
        condition: service_completed_successfully
      centrifugo-1:
        condition: service_started
      centrifugo-2:
        condition: service_started

  traefik:
    image: traefik:v3.1
    profiles: ["traefik"]
    ulimits: *big-ulimits
    networks:
      default:
        aliases: ["proxy"]
    volumes:
      - ./proxies/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./proxies/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ./certs:/certs:ro
    ports:
      - "8080:8080"
      - "8443:8443"
    depends_on:
      certgen:
        condition: service_completed_successfully
      centrifugo-1:
        condition: service_started
      centrifugo-2:
        condition: service_started

  caddy:
    image: caddy:2.8-alpine
    profiles: ["caddy"]
    ulimits: *big-ulimits
    networks:
      default:
        aliases: ["proxy"]
    volumes:
      - ./proxies/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
    ports:
      - "8080:8080"
      - "8443:8443"
    depends_on:
      certgen:
        condition: service_completed_successfully
      centrifugo-1:
        condition: service_started
      centrifugo-2:
        condition: service_started

  # Node test runner (centrifuge-js). Run via: docker compose run --rm tester
  tester:
    build: ./tester
    profiles: ["tester"]
    ulimits: *big-ulimits
    environment:
      # Bigger V8 heap so the load generator can hold many thousands of clients.
      NODE_OPTIONS: "--max-old-space-size=4096"
      PROXY_HOST: proxy
      HTTP_PORT: "8080"
      HTTPS_PORT: "8443"
      API_URL: http://centrifugo-1:8000
      API_KEY: proxy-lb-demo-api-key
      # Direct node endpoints for the deterministic cross-node emulation test.
      NODE1_URL: http://centrifugo-1:8000
      NODE2_URL: http://centrifugo-2:8000
      NODE_EXTRA_CA_CERTS: /certs/ca.crt
    volumes:
      - ./certs:/certs:ro
