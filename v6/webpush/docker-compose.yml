services:
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d test"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  centrifugo:
    image: centrifugo/centrifugo-pro:v6.8.2
    command: centrifugo -c /centrifugo/centrifugo.json
    ports:
      - "8000:8000"
    volumes:
      - ./centrifugo.json:/centrifugo/centrifugo.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  backend:
    build: ./backend
    ports:
      - "3002:5000"
    environment:
      - CENTRIFUGO_URL=http://centrifugo:8000
      - CONFIG_PATH=/app/centrifugo.json
    volumes:
      - ./centrifugo.json:/app/centrifugo.json:ro
    depends_on:
      - centrifugo
      - redis
      - postgres

  nginx:
    image: nginx:latest
    ports:
      - "9001:80"
    volumes:
      - ./static:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
